<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1425" />
    <link rel="icon" href="data:," />
    <title>AI Game Template — Hybrid Starter</title>
  </head>
  <body>
    <main id="app" aria-label="Hybrid game starter">
      <section class="playfield" id="playfield" aria-label="3D game area">
        <canvas id="world" aria-label="Interactive 3D world; press Enter to collect the target" tabindex="0"></canvas>
        <canvas id="overlay" aria-hidden="true"></canvas>
        <header class="hud">
          <div class="title-block">
            <span class="eyebrow">HYBRID WEB STARTER</span>
            <h1>Orbit Range</h1>
            <p>Tap the glowing orb. The overlay tracks it across the 3D world.</p>
          </div>
          <div class="score-panel" aria-live="polite">
            <span class="score-label">TARGETS</span>
            <strong id="score">0</strong>
          </div>
        </header>
        <footer class="controls">
          <p id="status" role="status">Target ready</p>
          <div class="button-group">
            <button id="pause-button" type="button">Pause</button>
            <button id="reset-button" type="button">Reset</button>
          </div>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
